name: Keychats Targeted Verify

on:
  push:
    branches:
      - 'feature/keychats-v1'
    paths:
      - '.github/workflows/keychats-targeted-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keychats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci
      - name: Targeted tests
        run: npm test -- url-preview.test.ts admin-actions.test.ts admin-service.test.ts app-shell.test.tsx
      - name: Production build
        run: npm run build
      - name: Verification marker
        run: echo "validated url preview and admin controls"
