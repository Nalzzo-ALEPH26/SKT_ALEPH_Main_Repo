name: Keychats URL Rebinding Verify

on:
  push:
    branches:
      - 'feature/keychats-v1'
    paths:
      - '.github/workflows/keychats-url-rebinding-red.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keychats
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci
      - name: URL preview regression tests
        run: npm test -- url-preview.test.ts
      - name: Production build
        run: npm run build
