name: Keychats URL Preview Unit

on:
  push:
    branches:
      - 'feature/keychats-v1'
    paths:
      - '.github/workflows/keychats-url-preview-unit.yml'

permissions:
  contents: read

jobs:
  url-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keychats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci
      - name: Verify RED contract
        run: |
          mv src/lib/url-preview/fetch-preview.ts /tmp/fetch-preview.ts
          mv src/lib/url-preview/url.ts /tmp/url.ts
          set +e
          npm test -- url-preview.test.ts >/tmp/keychats-url-preview-red.log 2>&1
          red_status=$?
          set -e
          mv /tmp/fetch-preview.ts src/lib/url-preview/fetch-preview.ts
          mv /tmp/url.ts src/lib/url-preview/url.ts
          if [ "$red_status" -eq 0 ]; then
            cat /tmp/keychats-url-preview-red.log
            echo 'Expected URL preview tests to fail without implementation.' >&2
            exit 1
          fi
      - name: URL preview unit tests
        run: npm test -- url-preview.test.ts
      - name: Production build
        run: npm run build
