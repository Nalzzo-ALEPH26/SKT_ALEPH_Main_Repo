name: Keychats Unit Temp

# Focused message-state server action verification.
on:
  push:
    branches:
      - 'feature/keychats-v1'
    paths:
      - '.github/workflows/keychats-unit-temp.yml'
      - 'keychats/src/app/(workspace)/message-state-actions.ts'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keychats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx vitest run tests/unit/message-state-actions.test.ts
