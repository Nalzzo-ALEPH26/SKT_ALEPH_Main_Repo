name: Keychats Unit Temp

# Focused DM repository GREEN verification.
on:
  push:
    branches:
      - 'feature/keychats-v1'
    paths:
      - '.github/workflows/keychats-unit-temp.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keychats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx vitest run tests/unit/dm-supabase.test.ts
