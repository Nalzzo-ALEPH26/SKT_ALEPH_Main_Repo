name: Keychats Unit Temp

on:
  push:
    branches:
      - feature/keychats-v1
    paths:
      - 'keychats/**'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keychats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: keychats/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
