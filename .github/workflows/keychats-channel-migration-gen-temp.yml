name: Keychats Channel Migration Generator Temp

on:
  push:
    branches:
      - 'feature/keychats-v1'
    paths:
      - '.github/workflows/keychats-channel-migration-gen-temp.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify migration command
        working-directory: keychats
        run: supabase migration new --help >/tmp/supabase-migration-new-help.txt
      - name: Generate migration
        working-directory: keychats
        run: supabase migration new channel_constraints
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keychats/supabase/migrations
          git commit -m "[skip ci] chore: create channel constraints migration"
          git push
