name: Keychats CI

on:
  push:
    branches:
      - 'feature/keychats-v1'
    paths:
      - 'keychats/**'
      - '.github/workflows/keychats-ci.yml'
  pull_request:
    paths:
      - 'keychats/**'
      - '.github/workflows/keychats-ci.yml'

permissions:
  contents: write

jobs:
  test-build-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keychats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify Supabase CLI
        run: |
          supabase --version
          supabase --help >/tmp/supabase-help.txt
          supabase test db --help >/tmp/supabase-test-help.txt
      - name: Start local Supabase
        run: supabase start
      - name: Database security tests
        run: supabase test db
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E smoke test
        run: npm run test:e2e
