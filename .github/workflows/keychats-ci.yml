name: Keychats CI

on:
  push:
    branches:
      - 'feature/keychats-v1'
    paths:
      - 'keychats/**'
      - '.github/workflows/keychats-ci.yml'
  pull_request:
    paths:
      - 'keychats/**'
      - '.github/workflows/keychats-ci.yml'

permissions:
  contents: write

jobs:
  test-build-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keychats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify Supabase CLI and initialize local config
        run: |
          supabase --version
          supabase --help >/tmp/supabase-help.txt
          supabase init --help >/tmp/supabase-init-help.txt
          if [ ! -f supabase/config.toml ]; then
            supabase init
          fi
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E smoke test
        run: npm run test:e2e
      - name: Commit generated Supabase config
        if: github.event_name == 'push'
        run: |
          if ! git ls-files --error-unmatch supabase/config.toml >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add supabase/config.toml
            git commit -m "chore: initialize keychats supabase"
            git push
          fi
