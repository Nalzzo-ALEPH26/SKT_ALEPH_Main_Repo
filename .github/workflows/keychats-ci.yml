name: Keychats CI

on:
  pull_request:
    paths:
      - 'keychats/**'
      - '.github/workflows/keychats-ci.yml'

concurrency:
  group: keychats-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# URL preview unit coverage includes DNS-rebinding regression protection.
jobs:
  test-build-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keychats
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: '2.121.0'
      - name: Verify Supabase CLI
        run: |
          supabase --version
          supabase test db --help >/tmp/supabase-test-help.txt
          supabase status --help >/tmp/supabase-status-help.txt
      - name: Start local Supabase
        run: supabase start
      - name: Export local Supabase runtime
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env >/tmp/keychats-supabase.env
          set -a
          source /tmp/keychats-supabase.env
          set +a

          test -n "${API_URL:-}"
          test -n "${PUBLISHABLE_KEY:-}"
          test -n "${SECRET_KEY:-}"

          echo "::add-mask::$SECRET_KEY"
          {
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$API_URL"
            printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$PUBLISHABLE_KEY"
            printf 'SUPABASE_SECRET_KEY=%s\n' "$SECRET_KEY"
          } >> "$GITHUB_ENV"
      - name: Database security tests
        run: supabase test db
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E smoke test
        run: npm run test:e2e
