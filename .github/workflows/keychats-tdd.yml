name: Keychats TDD

on:
  push:
    branches:
      - 'feature/keychats-v1*'
    paths:
      - 'keychats/**'
      - '.github/workflows/keychats-tdd.yml'
  pull_request:
    paths:
      - 'keychats/**'
      - '.github/workflows/keychats-tdd.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keychats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install
      - name: Unit tests
        run: npm test -- base-path.test.ts
