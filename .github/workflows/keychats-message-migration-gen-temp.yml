name: Keychats Message Migration Generator Temp

on:
  push:
    branches:
      - feature/keychats-v1
    paths:
      - '.github/workflows/keychats-message-migration-gen-temp.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/keychats-v1
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Generate migration
        working-directory: keychats
        run: supabase migration new message_realtime_moderation
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keychats/supabase/migrations
          git commit -m "chore: generate keychats message migration"
          git push origin HEAD:feature/keychats-v1
