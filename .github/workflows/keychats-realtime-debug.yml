name: Keychats Realtime Debug

# Focused verification for the visible DM control fix.
on:
  push:
    branches:
      - 'feature/keychats-v1'
    paths:
      - '.github/workflows/keychats-realtime-debug.yml'

permissions:
  contents: read

jobs:
  dm-e2e-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: keychats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: '2.121.0'
      - name: Start local Supabase
        run: supabase start
      - name: Export local Supabase runtime
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env >/tmp/keychats-supabase.env
          set -a
          source /tmp/keychats-supabase.env
          set +a
          echo "::add-mask::$SECRET_KEY"
          {
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$API_URL"
            printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$PUBLISHABLE_KEY"
            printf 'SUPABASE_SECRET_KEY=%s\n' "$SECRET_KEY"
          } >> "$GITHUB_ENV"
      - name: Install app dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run only DM E2E with Playwright API logging
        env:
          DEBUG: 'pw:api'
        run: npx playwright test tests/e2e/direct-messages.spec.ts --workers=1 --reporter=line
